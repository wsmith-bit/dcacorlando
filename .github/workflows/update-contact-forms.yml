name: Update Contact Forms

on:
  push:
    branches:
      - fix/contact-form-worker
    paths:
      - scripts/update_contact_forms.py
      - .github/workflows/update-contact-forms.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-forms:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/contact-form-worker
          fetch-depth: 0

      - name: Update every generated HTML form
        run: python3 scripts/update_contact_forms.py

      - name: Verify old fake forms are gone
        run: |
          if grep -R --include='*.html' -n 'onclick="submitForm()"' .; then
            echo "Old fake form handlers still remain."
            exit 1
          fi

      - name: Commit updated pages
        run: |
          if git diff --quiet; then
            echo "No contact form changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Connect all contact forms to lead worker"
          git push origin HEAD:fix/contact-form-worker
